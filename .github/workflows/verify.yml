name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-full:
    name: Linux full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Refresh apt metadata
        run: sudo apt-get update

      - name: Install FFmpeg and virtual display
        run: sudo apt-get install --yes ffmpeg xvfb

      - name: Install Playwright-managed Chromium and system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Run full deterministic verification
        run: xvfb-run -a uv run python scripts/verify.py full

  windows-focused:
    name: Windows focused verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install FFmpeg for local media fixtures
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Bypass the Chocolatey shim so subprocess timeouts kill the encoder itself.
          $encoders = @(Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Recurse -Filter ffmpeg.exe -File)
          if ($encoders.Count -ne 1) { throw "Expected one real FFmpeg executable" }
          $encoders[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Playwright-managed Chromium
        run: uv run playwright install chromium

      - name: Verify local UI
        run: uv run python scripts/verify.py ui

      - name: Run focused cross-platform verification
        run: >-
          uv run python scripts/verify.py fast --pytest
          tests/test_verify_harness.py
          tests/test_qc_domain.py
          tests/test_render_artifacts.py
          tests/test_qc_checks.py
          tests/test_qc_service.py
          tests/test_qc_cli.py
          tests/test_render_domain.py
          tests/test_render_text.py
          tests/test_render_media.py
          tests/test_render_service.py
          tests/test_render_cli.py
          tests/test_render_job_domain.py
          tests/test_render_handler.py
          tests/test_render_job_commands.py
          tests/test_api_render_http.py
          tests/test_api_render_media.py
          tests/test_api_worker.py
          tests/test_web_render_e2e.py
          tests/test_web_panel_e2e.py
          tests/test_web_import_e2e.py
          tests/test_web_voice_e2e.py
          tests/test_web_heygen_e2e.py
          tests/test_campaign_budget.py
          tests/test_api_campaign_budget.py
          tests/test_api_voice_actions.py
          tests/test_voice_human_review.py
          tests/test_image_import_manifest.py
          tests/test_api_image_import_ui.py
          tests/test_image_import_batch.py
          tests/test_config_paths.py
          tests/test_models.py
          tests/test_image_generation.py
          tests/test_image_domain.py
          tests/test_image_migrations.py
          tests/test_image_repository.py
          tests/test_image_concurrency.py
          tests/test_image_recovery.py
          tests/test_image_cli.py
          tests/test_job_migrations.py
          tests/test_migration_lock.py
          tests/test_job_concurrency.py
          tests/test_flow_domain.py
          tests/test_flow_config.py
          tests/test_flow_lock.py
          tests/test_flow_locators.py
          tests/test_flow_diagnostics.py
          tests/test_flow_runtime.py
          tests/test_flow_service.py
          tests/test_flow_cli.py
          tests/test_flow_security.py
          tests/test_flow_generation_locators.py
          tests/test_flow_artifacts.py
          tests/test_flow_generation.py
          tests/test_flow_image_handler.py
          tests/test_flow_recovery.py
          tests/test_flow_generation_security.py
