name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-full:
    name: Linux full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh apt metadata
        run: sudo apt-get update

      - name: Install FFmpeg and virtual display
        run: sudo apt-get install --yes ffmpeg xvfb

      - name: Install Playwright-managed Chromium and system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Run full deterministic verification
        run: xvfb-run -a uv run python scripts/verify.py full

  windows-focused:
    name: Windows focused verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Install Playwright-managed Chromium
        run: uv run playwright install chromium

      - name: Run focused cross-platform verification
        run: >-
          uv run python scripts/verify.py fast --pytest
          tests/test_verify_harness.py
          tests/test_config_paths.py
          tests/test_models.py
          tests/test_image_generation.py
          tests/test_image_domain.py
          tests/test_image_migrations.py
          tests/test_image_repository.py
          tests/test_image_concurrency.py
          tests/test_image_recovery.py
          tests/test_image_cli.py
          tests/test_job_migrations.py
          tests/test_migration_lock.py
          tests/test_job_concurrency.py
          tests/test_flow_domain.py
          tests/test_flow_config.py
          tests/test_flow_lock.py
          tests/test_flow_locators.py
          tests/test_flow_diagnostics.py
          tests/test_flow_runtime.py
          tests/test_flow_service.py
          tests/test_flow_cli.py
          tests/test_flow_security.py
