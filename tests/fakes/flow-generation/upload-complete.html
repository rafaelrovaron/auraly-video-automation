<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Flow upload complete</title></head>
  <body>
    <main aria-label="Flow workspace">
      <label for="reference-image">Reference image</label>
      <input id="reference-image" type="file">
      <label for="generation-prompt">Prompt</label>
      <textarea id="generation-prompt"></textarea>
      <button type="button">Generate</button>
      <output id="upload-complete" role="status" aria-label="Reference upload complete">Complete</output>
    </main>
  </body>
</html>
